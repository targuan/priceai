{% extends 'base.html' %}

{% block title %}Suppression d'une marque{% endblock %}

{% block content %}
<h1>Supprimer cette marque ?</h1>

<p>Voulez-vous vraiment supprimer la marque <strong>{{ object.name }}</strong> ?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Supprimer</button>
    <a href="{% url 'brand_list' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
