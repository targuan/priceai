{% extends 'base.html' %}

{% block title %}{{ view.object|default:"Nouveau prix" }}{% endblock %}

{% block content %}
<h1>{% if view.object %}Modifier le prix{% else %}Ajouter un prix{% endif %}</h1>

<form method="post" class="mt-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Enregistrer</button>
    <a href="{% url 'price_list' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
