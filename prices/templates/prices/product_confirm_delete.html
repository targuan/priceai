{% extends 'base.html' %}

{% block title %}Suppression d'un produit{% endblock %}

{% block content %}
<h1>Supprimer ce produit ?</h1>

<p>Voulez-vous vraiment supprimer le produit <strong>{{ object.name }}</strong> ?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Supprimer</button>
    <a href="{% url 'product_list' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
