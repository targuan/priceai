apiVersion: apps/v1
kind: Deployment
metadata:
  name: price-tracker
  labels:
    app: price-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: price-tracker
  template:
    metadata:
      labels:
        app: price-tracker
    spec:
      containers:
      - name: price-tracker
        image: ghcr.io/username/price-tracker:main
        ports:
        - containerPort: 8000
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: price-tracker-secret
              key: secret-key
        - name: DEBUG
          value: "False"
        - name: ALLOWED_HOSTS
          value: "*"
---
apiVersion: v1
kind: Service
metadata:
  name: price-tracker-service
spec:
  selector:
    app: price-tracker
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
